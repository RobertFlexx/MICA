<polygon fill="white" stroke="transparent" points="-25.2,25.2 -25.2,-618.2 1155.2,-618.2 1155.2,25.2 -25.2,25.2"/>
<text text-anchor="start" x="132" y="-567.8" font-family="DejaVu Sans" font-weight="bold" font-size="19.00">MICA 3.0 development | 03 / 20 | Instruction fields, extension guards and control</text>
<text text-anchor="start" x="132" y="-535.8" font-family="DejaVu Sans" font-size="14.00">ISA 2.0 compatibility baseline | E32: XLEN=32, XREG/MUL/FLOW/BITOPS/TRAP/REG_PARITY=1 | implemented RTL</text>
<text text-anchor="start" x="132" y="-510" font-family="DejaVu Sans" font-size="10.00">RTL source set 5fbe88e7b5ecdbe5 | internal clock: clk_i rising edge; reset: rst_ni active low</text>
<text text-anchor="start" x="132" y="-485" font-family="DejaVu Sans" font-size="10.00">Class = lo[15:14]; long major = lo[13:10]; payload p = {lo[9:0],hi}.</text>
<text text-anchor="start" x="132" y="-474" font-family="DejaVu Sans" font-size="10.00">Unused fields and unassigned encodings are illegal. Schema overlap checks supplement RTL guards.</text>
<text text-anchor="start" x="209.5" y="-463" font-family="DejaVu Sans" font-size="10.00">No mandatory vector, atomic, DSP accumulator or hidden loop state.</text>
<text text-anchor="start" x="132" y="-438.8" font-family="DejaVu Sans" font-size="9.00">Blue: data. Dashed gray: control/handshake. Red: fault. Repeated Nxx labels connect without a wire. Crossings do not join.</text>
