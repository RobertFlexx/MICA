<text text-anchor="start" x="45" y="-442.8" font-family="DejaVu Sans" font-weight="bold" font-size="19.00">MICA 3.0 development | 12 / 20 | Optional multiplication and software division</text>
<text text-anchor="start" x="45" y="-410.8" font-family="DejaVu Sans" font-size="14.00">ISA 2.0 compatibility baseline | E32: XLEN=32, XREG/MUL/FLOW/BITOPS/TRAP/REG_PARITY=1 | implemented RTL</text>
<text text-anchor="start" x="45" y="-385" font-family="DejaVu Sans" font-size="10.00">RTL source set 5fbe88e7b5ecdbe5 | internal clock: clk_i rising edge; reset: rst_ni active low</text>
<text text-anchor="start" x="45" y="-360" font-family="DejaVu Sans" font-size="10.00">MUL=0 removes multiplication. Short, ALU3 and W32 forms share the product; W32 zeros the upper operand halves.</text>
<text text-anchor="start" x="45" y="-349" font-family="DejaVu Sans" font-size="10.00">No divider exists in RTL. stdlib/math32.mica and math64.mica provide software division.</text>
<text text-anchor="start" x="93.5" y="-338" font-family="DejaVu Sans" font-size="10.00">No iterative multiplier, high&#45;half product, MAC accumulator or claimed clock frequency is drawn.</text>
<text text-anchor="start" x="45" y="-313.8" font-family="DejaVu Sans" font-size="9.00">Blue: data. Dashed gray: control/handshake. Red: fault. Repeated Nxx labels connect without a wire. Crossings do not join.</text>
