<polygon fill="white" stroke="transparent" points="-25.2,25.2 -25.2,-466.2 1001.2,-466.2 1001.2,25.2 -25.2,25.2"/>
<text text-anchor="start" x="15" y="-415.8" font-family="DejaVu Sans" font-weight="bold" font-size="19.00">MICA 3.0 development | 19 / 20 | Implemented register parity and watchdog supervision</text>
<text text-anchor="start" x="15" y="-383.8" font-family="DejaVu Sans" font-size="14.00">ISA 2.0 compatibility baseline | E32: XLEN=32, XREG/MUL/FLOW/BITOPS/TRAP/REG_PARITY=1 | implemented RTL</text>
<text text-anchor="start" x="15" y="-358" font-family="DejaVu Sans" font-size="10.00">RTL source set 5fbe88e7b5ecdbe5 | internal clock: clk_i rising edge; reset: rst_ni active low</text>
<text text-anchor="start" x="15" y="-333" font-family="DejaVu Sans" font-size="10.00">Parity is updated from committed values and checked before decode effects; no register correction.</text>
<text text-anchor="start" x="15" y="-322" font-family="DejaVu Sans" font-size="10.00">The VHDL watchdog is independent of CPU STOP and can signal a level IRQ under platform policy.</text>
<text text-anchor="start" x="15" y="-311" font-family="DejaVu Sans" font-size="10.00">No SRAM ECC, scrubber, lockstep core, protected diagnostics or safety qualification is implemented.</text>
<text text-anchor="start" x="15" y="-286.8" font-family="DejaVu Sans" font-size="9.00">Blue: data. Dashed gray: control/handshake. Red: fault. Repeated Nxx labels connect without a wire. Crossings do not join.</text>
