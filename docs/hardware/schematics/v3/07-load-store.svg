<title>sheet</title>
<polygon fill="white" stroke="transparent" points="-25.2,25.2 -25.2,-609.2 1070.7,-609.2 1070.7,25.2 -25.2,25.2"/>
<text text-anchor="start" x="61.75" y="-558.3" font-family="DejaVu Sans" font-weight="bold" font-size="19.00">MICA 3.0 development | 07 / 20 | Transactional load/store and precise pointer updates</text>
<text text-anchor="start" x="61.75" y="-526.3" font-family="DejaVu Sans" font-size="14.00">ISA 2.0 compatibility baseline | E32: XLEN=32, XREG/MUL/FLOW/BITOPS/TRAP/REG_PARITY=1 | implemented RTL</text>
<text text-anchor="start" x="61.75" y="-500.5" font-family="DejaVu Sans" font-size="10.00">RTL source set 5fbe88e7b5ecdbe5 | internal clock: clk_i rising edge; reset: rst_ni active low</text>
<text text-anchor="start" x="61.75" y="-475.5" font-family="DejaVu Sans" font-size="10.00">One outstanding data transaction. Narrow writes use byte strobes at the selected XLEN bus lane.</text>
<text text-anchor="start" x="61.75" y="-464.5" font-family="DejaVu Sans" font-size="10.00">F uses old base for access; successful COMMIT writes result and updated base together.</text>
<text text-anchor="start" x="61.75" y="-453.5" font-family="DejaVu Sans" font-size="10.00">Signed F sign&#45;extends to XLEN; base/destination alias is illegal. Errors write neither.</text>
<text text-anchor="start" x="61.75" y="-442.5" font-family="DejaVu Sans" font-size="10.00">Fabric must not commit a failed store. Memory response time currently has no finite hardware timeout.</text>
<text text-anchor="start" x="61.75" y="-418.3" font-family="DejaVu Sans" font-size="9.00">Blue: data. Dashed gray: control/handshake. Red: fault. Repeated Nxx labels connect without a wire. Crossings do not join.</text>
