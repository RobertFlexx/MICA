<text text-anchor="start" x="15.5" y="-429.8" font-family="DejaVu Sans" font-weight="bold" font-size="19.00">MICA 3.0 development | 14 / 20 | Implemented scalar DSP stream and SIMD status</text>
<text text-anchor="start" x="15.5" y="-397.8" font-family="DejaVu Sans" font-size="14.00">ISA 2.0 compatibility baseline | E32: XLEN=32, XREG/MUL/FLOW/BITOPS/TRAP/REG_PARITY=1 | implemented RTL</text>
<text text-anchor="start" x="15.5" y="-372" font-family="DejaVu Sans" font-size="10.00">RTL source set 5fbe88e7b5ecdbe5 | internal clock: clk_i rising edge; reset: rst_ni active low</text>
<text text-anchor="start" x="15.5" y="-347" font-family="DejaVu Sans" font-size="10.00">The signed dot&#45;product kernel uses ordinary GPRs and M/F; no hidden accumulator state.</text>
<text text-anchor="start" x="15.5" y="-336" font-family="DejaVu Sans" font-size="10.00">Packed arithmetic and 128&#45;bit SIMD are NOT implemented in RTL. Eight vector registers exist only in the emulator.</text>
<text text-anchor="start" x="85.5" y="-325" font-family="DejaVu Sans" font-size="10.00">No saturation, rounding, vector load/store or vector datapath is depicted as hardware.</text>
<text text-anchor="start" x="15.5" y="-300.8" font-family="DejaVu Sans" font-size="9.00">Blue: data. Dashed gray: control/handshake. Red: fault. Repeated Nxx labels connect without a wire. Crossings do not join.</text>
