<text text-anchor="start" x="26.5" y="-679.3" font-family="DejaVu Sans" font-weight="bold" font-size="19.00">MICA 3.0 development | 04 / 20 | Scalar register storage and writeback</text>
<text text-anchor="start" x="26.5" y="-647.3" font-family="DejaVu Sans" font-size="14.00">ISA 2.0 compatibility baseline | E32: XLEN=32, XREG/MUL/FLOW/BITOPS/TRAP/REG_PARITY=1 | implemented RTL</text>
<text text-anchor="start" x="26.5" y="-621.5" font-family="DejaVu Sans" font-size="10.00">RTL source set 5fbe88e7b5ecdbe5 | internal clock: clk_i rising edge; reset: rst_ni active low</text>
<text text-anchor="start" x="26.5" y="-596.5" font-family="DejaVu Sans" font-size="10.00">Displayed E32 configuration has 16 registers. C32 has 8; L64 has 16 x 64 bits.</text>
<text text-anchor="start" x="26.5" y="-585.5" font-family="DejaVu Sans" font-size="10.00">Two logical writeback slots, used together by F; source RTL uses individually reset registers.</text>
<text text-anchor="start" x="26.5" y="-574.5" font-family="DejaVu Sans" font-size="10.00">Read paths include hardwired SP and format&#45;specific address reads; this is not a claimed two&#45;port SRAM.</text>
<text text-anchor="start" x="41" y="-563.5" font-family="DejaVu Sans" font-size="10.00">x0 reads zero, writes are suppressed. Reset: others zero; x7=(RAM_BYTES&#45;16) rounded down to 16.</text>
<text text-anchor="start" x="26.5" y="-539.3" font-family="DejaVu Sans" font-size="9.00">Blue: data. Dashed gray: control/handshake. Red: fault. Repeated Nxx labels connect without a wire. Crossings do not join.</text>
