<polygon fill="white" stroke="transparent" points="-25.2,25.2 -25.2,-602.2 869.2,-602.2 869.2,25.2 -25.2,25.2"/>
<text text-anchor="start" x="15" y="-551.8" font-family="DejaVu Sans" font-weight="bold" font-size="19.00">MICA 3.0 development | 06 / 20 | Branches, calls, returns and counted loops</text>
<text text-anchor="start" x="15" y="-519.8" font-family="DejaVu Sans" font-size="14.00">ISA 2.0 compatibility baseline | E32: XLEN=32, XREG/MUL/FLOW/BITOPS/TRAP/REG_PARITY=1 | implemented RTL</text>
<text text-anchor="start" x="15" y="-494" font-family="DejaVu Sans" font-size="10.00">RTL source set 5fbe88e7b5ecdbe5 | internal clock: clk_i rising edge; reset: rst_ni active low</text>
<text text-anchor="start" x="15" y="-469" font-family="DejaVu Sans" font-size="10.00">Branch displacements are halfwords from sequential PC. ADRPC alone uses instruction PC.</text>
<text text-anchor="start" x="15" y="-458" font-family="DejaVu Sans" font-size="10.00">Calls write x6; ret is jr x6. dbnz.s uses an ordinary register and no loop&#45;state CSRs.</text>
<text text-anchor="start" x="15" y="-447" font-family="DejaVu Sans" font-size="10.00">Odd control targets trap before commit. There is no pipeline flush circuit in this implementation.</text>
<text text-anchor="start" x="15" y="-422.8" font-family="DejaVu Sans" font-size="9.00">Blue: data. Dashed gray: control/handshake. Red: fault. Repeated Nxx labels connect without a wire. Crossings do not join.</text>
