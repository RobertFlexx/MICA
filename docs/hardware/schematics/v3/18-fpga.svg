<text text-anchor="start" x="119.75" y="-423.3" font-family="DejaVu Sans" font-size="14.00">ISA 2.0 compatibility baseline | Arty A7&#45;100 board interface | implemented RTL</text>
<text text-anchor="start" x="119.75" y="-397.5" font-family="DejaVu Sans" font-size="10.00">RTL source set 5fbe88e7b5ecdbe5 | internal clock: clk_i rising edge; reset: rst_ni active low</text>
<text text-anchor="start" x="119.75" y="-372.5" font-family="DejaVu Sans" font-size="10.00">Only the eight connections present in boards/arty_a7/arty_a7.xdc are shown.</text>
<text text-anchor="start" x="119.75" y="-361.5" font-family="DejaVu Sans" font-size="10.00">Pin map checked against the Digilent Arty&#45;A7&#45;100 master constraints, Rev D/E.</text>
<text text-anchor="start" x="119.75" y="-350.5" font-family="DejaVu Sans" font-size="10.00">This is an FPGA interface drawing, not a new PCB or an electrical schematic.</text>
<text text-anchor="start" x="124.25" y="-339.5" font-family="DejaVu Sans" font-size="10.00">Vivado placement/routing, physical boot and board timing remain unverified.</text>
<text text-anchor="start" x="119.75" y="-315.3" font-family="DejaVu Sans" font-size="9.00">Blue: data. Dashed gray: control/handshake. Red: fault. Repeated Nxx labels connect without a wire. Crossings do not join.</text>
