<title>sheet</title>
<polygon fill="white" stroke="transparent" points="-25.2,25.2 -25.2,-695.2 1057.7,-695.2 1057.7,25.2 -25.2,25.2"/>
<text text-anchor="start" x="102.25" y="-644.3" font-family="DejaVu Sans" font-weight="bold" font-size="19.00">MICA 3.0 development | 09 / 20 | Precise traps, interrupt priority and wakeup</text>
<text text-anchor="start" x="102.25" y="-612.3" font-family="DejaVu Sans" font-size="14.00">ISA 2.0 compatibility baseline | E32: XLEN=32, XREG/MUL/FLOW/BITOPS/TRAP/REG_PARITY=1 | implemented RTL</text>
<text text-anchor="start" x="102.25" y="-586.5" font-family="DejaVu Sans" font-size="10.00">RTL source set 5fbe88e7b5ecdbe5 | internal clock: clk_i rising edge; reset: rst_ni active low</text>
<text text-anchor="start" x="102.25" y="-561.5" font-family="DejaVu Sans" font-size="10.00">Timer pending has priority over external/software when both enabled. Global enable gates delivery, not wake.</text>
<text text-anchor="start" x="102.25" y="-550.5" font-family="DejaVu Sans" font-size="10.00">Enabled interrupts enter directly from SLEEP; other pending events resume START.</text>
<text text-anchor="start" x="102.25" y="-539.5" font-family="DejaVu Sans" font-size="10.00">Synchronous faults save faulting PC. 2.0 ecall also saves its own PC. No partial GPR commit.</text>
<text text-anchor="start" x="175.75" y="-528.5" font-family="DejaVu Sans" font-size="10.00">Nested exceptions are not supported; an unrecoverable entry halts with fault_o.</text>
<text text-anchor="start" x="102.25" y="-504.3" font-family="DejaVu Sans" font-size="9.00">Blue: data. Dashed gray: control/handshake. Red: fault. Repeated Nxx labels connect without a wire. Crossings do not join.</text>
