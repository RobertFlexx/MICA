<text text-anchor="start" x="32.25" y="-708.3" font-family="DejaVu Sans" font-weight="bold" font-size="19.00">MICA 3.0 development | 08 / 20 | CSR permissions, counters and trap state</text>
<text text-anchor="start" x="32.25" y="-676.3" font-family="DejaVu Sans" font-size="14.00">ISA 2.0 compatibility baseline | E32: XLEN=32, XREG/MUL/FLOW/BITOPS/TRAP/REG_PARITY=1 | implemented RTL</text>
<text text-anchor="start" x="32.25" y="-650.5" font-family="DejaVu Sans" font-size="10.00">RTL source set 5fbe88e7b5ecdbe5 | internal clock: clk_i rising edge; reset: rst_ni active low</text>
<text text-anchor="start" x="32.25" y="-625.5" font-family="DejaVu Sans" font-size="10.00">Addresses and masks are indexed in the generated ISA/CSR tables; unimplemented IDs are illegal.</text>
<text text-anchor="start" x="32.25" y="-614.5" font-family="DejaVu Sans" font-size="10.00">coreid/features/arch/counters are read&#45;only. TRAP=0 removes privileged trap/timer state.</text>
<text text-anchor="start" x="32.25" y="-603.5" font-family="DejaVu Sans" font-size="10.00">PERF controls cycle/instret implementation. Timer ticks in SLEEP; STOP stops core counters.</text>
<text text-anchor="start" x="88.25" y="-592.5" font-family="DejaVu Sans" font-size="10.00">One active handler; no implemented privilege levels or memory protection.</text>
<text text-anchor="start" x="32.25" y="-568.3" font-family="DejaVu Sans" font-size="9.00">Blue: data. Dashed gray: control/handshake. Red: fault. Repeated Nxx labels connect without a wire. Crossings do not join.</text>
