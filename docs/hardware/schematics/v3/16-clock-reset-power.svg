<text text-anchor="start" x="44.25" y="-580.3" font-family="DejaVu Sans" font-weight="bold" font-size="19.00">MICA 3.0 development | 16 / 20 | Clock, reset, sleep and activity controls</text>
<text text-anchor="start" x="44.25" y="-548.3" font-family="DejaVu Sans" font-size="14.00">ISA 2.0 compatibility baseline | Arty A7&#45;100 board interface | implemented RTL</text>
<text text-anchor="start" x="44.25" y="-522.5" font-family="DejaVu Sans" font-size="10.00">RTL source set 5fbe88e7b5ecdbe5 | internal clock: clk_i rising edge; reset: rst_ni active low</text>
<text text-anchor="start" x="44.25" y="-497.5" font-family="DejaVu Sans" font-size="10.00">One internal clock domain. UART input and external IRQ use synchronizers where instantiated.</text>
<text text-anchor="start" x="44.25" y="-486.5" font-family="DejaVu Sans" font-size="10.00">No generated internal clock, physical clock gate, voltage scaling or power&#45;rail controller exists.</text>
<text text-anchor="start" x="44.25" y="-475.5" font-family="DejaVu Sans" font-size="10.00">WFI prevents new CPU requests/retirement; clock and enabled timer/counters continue.</text>
<text text-anchor="start" x="82.75" y="-464.5" font-family="DejaVu Sans" font-size="10.00">100 MHz is the board source and constraint request, not routed Fmax evidence.</text>
<text text-anchor="start" x="44.25" y="-440.3" font-family="DejaVu Sans" font-size="9.00">Blue: data. Dashed gray: control/handshake. Red: fault. Repeated Nxx labels connect without a wire. Crossings do not join.</text>
