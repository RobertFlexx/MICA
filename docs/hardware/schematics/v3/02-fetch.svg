<title>sheet</title>
<polygon fill="white" stroke="transparent" points="-25.2,25.2 -25.2,-682.2 905.2,-682.2 905.2,25.2 -25.2,25.2"/>
<text text-anchor="start" x="45" y="-631.3" font-family="DejaVu Sans" font-weight="bold" font-size="19.00">MICA 3.0 development | 02 / 20 | Instruction fetch and parcel assembly</text>
<text text-anchor="start" x="45" y="-599.3" font-family="DejaVu Sans" font-size="14.00">ISA 2.0 compatibility baseline | E32: XLEN=32, XREG/MUL/FLOW/BITOPS/TRAP/REG_PARITY=1 | implemented RTL</text>
<text text-anchor="start" x="45" y="-573.5" font-family="DejaVu Sans" font-size="10.00">RTL source set 5fbe88e7b5ecdbe5 | internal clock: clk_i rising edge; reset: rst_ni active low</text>
<text text-anchor="start" x="45" y="-548.5" font-family="DejaVu Sans" font-size="10.00">Fetch requests are four&#45;byte aligned and return one 32&#45;bit word. One outstanding request.</text>
<text text-anchor="start" x="45" y="-537.5" font-family="DejaVu Sans" font-size="10.00">FAST_FETCH=1: an aligned long instruction captures both parcels without another lookup.</text>
<text text-anchor="start" x="45" y="-526.5" font-family="DejaVu Sans" font-size="10.00">Cross&#45;word long instructions fetch the second word. Redirects use tags; overlapping stores and fence.i invalidate.</text>
<text text-anchor="start" x="94" y="-515.5" font-family="DejaVu Sans" font-size="10.00">Request fields remain stable under backpressure; response errors never retire the instruction.</text>
<text text-anchor="start" x="45" y="-491.3" font-family="DejaVu Sans" font-size="9.00">Blue: data. Dashed gray: control/handshake. Red: fault. Repeated Nxx labels connect without a wire. Crossings do not join.</text>
