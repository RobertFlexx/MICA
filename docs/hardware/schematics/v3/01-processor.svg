<title>sheet</title>
<polygon fill="white" stroke="transparent" points="-25.2,25.2 -25.2,-930.2 1071.2,-930.2 1071.2,25.2 -25.2,25.2"/>
<text text-anchor="start" x="128" y="-879.8" font-family="DejaVu Sans" font-weight="bold" font-size="19.00">MICA 3.0 development | 01 / 20 | Complete scalar processor organization</text>
<text text-anchor="start" x="128" y="-847.8" font-family="DejaVu Sans" font-size="14.00">ISA 2.0 compatibility baseline | E32: XLEN=32, XREG/MUL/FLOW/BITOPS/TRAP/REG_PARITY=1 | implemented RTL</text>
<text text-anchor="start" x="128" y="-822" font-family="DejaVu Sans" font-size="10.00">RTL source set 5fbe88e7b5ecdbe5 | internal clock: clk_i rising edge; reset: rst_ni active low</text>
<text text-anchor="start" x="128" y="-797" font-family="DejaVu Sans" font-size="10.00">Single issue, multicycle; no implemented pipeline or speculative state.</text>
<text text-anchor="start" x="128" y="-786" font-family="DejaVu Sans" font-size="10.00">Dashed regions are logical portions of mica_core_txn, not invented RTL modules.</text>
<text text-anchor="start" x="128" y="-775" font-family="DejaVu Sans" font-size="10.00">clk_i: rising edge. rst_ni: asynchronous active low. Two effects may commit together for F.</text>
<text text-anchor="start" x="128" y="-750.8" font-family="DejaVu Sans" font-size="9.00">Blue: data. Dashed gray: control/handshake. Red: fault. Repeated Nxx labels connect without a wire. Crossings do not join.</text>
