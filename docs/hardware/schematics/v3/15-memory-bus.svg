<title>sheet</title>
<polygon fill="white" stroke="transparent" points="-25.2,25.2 -25.2,-491.2 965.2,-491.2 965.2,25.2 -25.2,25.2"/>
<text text-anchor="start" x="15" y="-440.3" font-family="DejaVu Sans" font-weight="bold" font-size="19.00">MICA 3.0 development | 15 / 20 | Memory routing, ownership and synchronous SRAM</text>
<text text-anchor="start" x="15" y="-408.3" font-family="DejaVu Sans" font-size="14.00">ISA 2.0 compatibility baseline | Enabled SoC interfaces | implemented RTL</text>
<text text-anchor="start" x="15" y="-382.5" font-family="DejaVu Sans" font-size="10.00">RTL source set 5fbe88e7b5ecdbe5 | internal clock: clk_i rising edge; reset: rst_ni active low</text>
<text text-anchor="start" x="15" y="-357.5" font-family="DejaVu Sans" font-size="10.00">Each port owns one held response. Effects occur only on accepted requests.</text>
<text text-anchor="start" x="15" y="-346.5" font-family="DejaVu Sans" font-size="10.00">No arbitration between concurrent harts, cache coherence or multicore fabric exists.</text>
<text text-anchor="start" x="15" y="-335.5" font-family="DejaVu Sans" font-size="10.00">SRAM payload has no reset; response flags reset synchronously. Same&#45;word cross&#45;port read/write is unspecified.</text>
<text text-anchor="start" x="23.5" y="-324.5" font-family="DejaVu Sans" font-size="10.00">Core phases avoid overlapping instruction fetch and data access. Transaction timeouts are not implemented.</text>
<text text-anchor="start" x="15" y="-300.3" font-family="DejaVu Sans" font-size="9.00">Blue: data. Dashed gray: control/handshake. Red: fault. Repeated Nxx labels connect without a wire. Crossings do not join.</text>
