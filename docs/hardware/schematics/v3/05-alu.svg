<text text-anchor="start" x="108.25" y="-550.8" font-family="DejaVu Sans" font-weight="bold" font-size="19.00">MICA 3.0 development | 05 / 20 | Arithmetic, logic, shifts and comparison</text>
<text text-anchor="start" x="108.25" y="-518.8" font-family="DejaVu Sans" font-size="14.00">ISA 2.0 compatibility baseline | E32: XLEN=32, XREG/MUL/FLOW/BITOPS/TRAP/REG_PARITY=1 | implemented RTL</text>
<text text-anchor="start" x="108.25" y="-493" font-family="DejaVu Sans" font-size="10.00">RTL source set 5fbe88e7b5ecdbe5 | internal clock: clk_i rising edge; reset: rst_ni active low</text>
<text text-anchor="start" x="108.25" y="-468" font-family="DejaVu Sans" font-size="10.00">Combinational RTL operations; implementation carry topology and timing require mapped reports.</text>
<text text-anchor="start" x="108.25" y="-457" font-family="DejaVu Sans" font-size="10.00">Shift counts are masked to XLEN&#45;1. Comparisons produce integer 0 or 1; no condition&#45;code register.</text>
<text text-anchor="start" x="126.25" y="-446" font-family="DejaVu Sans" font-size="10.00">W32 results sign&#45;extend to XLEN64. Multiply is optional and not a mandatory C32 datapath.</text>
<text text-anchor="start" x="108.25" y="-421.8" font-family="DejaVu Sans" font-size="9.00">Blue: data. Dashed gray: control/handshake. Red: fault. Repeated Nxx labels connect without a wire. Crossings do not join.</text>
